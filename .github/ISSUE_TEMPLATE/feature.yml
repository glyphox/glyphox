name: Feature request
description: Something Glyphox should do but can't yet.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: "What you were building, and where Glyphox got in the way." }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: What would help }
  - type: textarea
    id: steps
    attributes: { label: How you do it today, description: "How many steps or clicks it takes now." }
