name: Bug
description: Glyphox gave a wrong answer, refused a valid call, or generated something that doesn't work.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Search the open issues first. Agents: paste the body from Glyphox's `report` tool instead. Don't include secrets, keys, personal data or app records."
  - type: input
    id: version
    attributes: { label: Glyphox version, placeholder: "1.0.1 (Extensions view, or the report tool)" }
    validations: { required: true }
  - type: dropdown
    id: door
    attributes: { label: Where, options: [MCP (an outside agent), Chat view (the Assistant), An editor or panel, The exported app, Other] }
    validations: { required: true }
  - type: input
    id: tool
    attributes: { label: Tool or surface, placeholder: "e.g. create_workflow, the page designer, export_check" }
  - type: textarea
    id: what
    attributes: { label: What you did, description: "The call and its arguments, or the clicks." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: What happened, description: "The answer, error or result, exactly as shown." }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
  - type: dropdown
    id: severity
    attributes: { label: Severity, options: [low, medium, high, critical] }
