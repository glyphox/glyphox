name: Bug in Etyma
description: Etyma answered wrongly, refused a valid call, or generated something that does not work.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Search the open issues first. Agents: paste the body from Etyma's `etyma_report` tool instead of filling this in. Never include secrets, keys, personal data or app records."
  - type: input
    id: version
    attributes: { label: Etyma version, placeholder: "0.x.y (Help → About, or etyma_report)" }
    validations: { required: true }
  - type: dropdown
    id: door
    attributes: { label: Where, options: [MCP (an outside agent), Chat view (the Assistant), An editor or panel, The exported app, Other] }
    validations: { required: true }
  - type: input
    id: tool
    attributes: { label: Tool or surface, placeholder: "e.g. create_workflow, the page designer, export_check" }
  - type: textarea
    id: what
    attributes: { label: What was tried, description: "The call and its arguments, or the clicks." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual, description: "The answer, error or result, word for word." }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Smallest steps to reproduce }
  - type: dropdown
    id: severity
    attributes: { label: Severity, options: [low, medium, high, critical] }
